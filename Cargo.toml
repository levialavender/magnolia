[package]
name = "magnolia"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
eframe = "0.29"
chrono = "0.4"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
